    target: tracker
    lower: 0.0
    upper: 1.0
    granularity: 0.05
  - name: track_buffer
    target: tracker
    lower: 10
    upper: 100
    granularity: 1
    is_int: true
  - name: match_thresh
    target: tracker
    lower: 0.0
    upper: 1.0
    granularity: 0.05
  - name: lost_match_thr
    target: tracker
    lower: 0.0
    upper: 1.0
    granularity: 0.05
  - name: iou_weight
    target: tracker
    lower: 0.0
    upper: 1.0
    granularity: 0.05
