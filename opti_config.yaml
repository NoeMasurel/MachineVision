    target: tracker
    lower: 0.0
    upper: 1.0
    granularity: 0.05
  - name: penalty_p
    target: tracker
    lower: 0.0
    upper: 1.0
    granularity: 0.05
  - name: penalty_q
    target: tracker
    lower: 0.0
    upper: 1.0
    granularity: 0.05
  - name: reduce_step
    target: tracker
    lower: 0.0
    upper: 1.0
    granularity: 0.05
  - name: tai_thr
    target: tracker
    lower: 0.0
    upper: 1.0
    granularity: 0.05
  - name: min_track_len
    target: tracker
    lower: 0
    upper: 10
    granularity: 1
