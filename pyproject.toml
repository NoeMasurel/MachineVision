[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tracking"
version = "0.1.0"
description = "Tracking, evaluation, and optimization toolkit for MOT pipelines built on Ultralytics + TrackEval + NOMAD"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "opencv-python",
    "PyYAML",
    "ultralytics",
    "motmetrics",
    "trackeval",
    "PyNomadBBO",
    "ffmpeg-python",
]

[project.scripts]
track = "tracking.cli.main:track"
evaluate = "tracking.cli.main:evaluate"
optimize = "tracking.cli.main:optimize"

[tool.hatch.build.targets.wheel]
packages = ["src/tracking"]

[tool.pytest.ini_options]
testpaths = ["tests"]
